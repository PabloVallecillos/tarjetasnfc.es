<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar tarjetas | TarjetasNFC</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="setup-page">
<main class="setup-shell">
  <section class="gen-panel">
    <a class="setup-brand" href="/">Tarjetas<span>NFC</span></a>
    <h1>Generar tarjetas Google Review</h1>
    <p class="setup-copy">Creá hasta 20 tarjetas de una. Cada QR lleva a un ID único. Cuando el cliente lo escanea, configura su URL de destino.</p>

    <form id="gen-form" class="setup-form gen-form">
      <label for="count">Cantidad</label>
      <input id="count" class="review-input" type="number" min="1" max="20" value="10">

      <label for="domain">Dominio</label>
      <input id="domain" class="review-input" value="tarjetasnfc.es">

      <button class="btn btn-primary btn-sm" type="submit">Generar tarjetas</button>
    </form>

    <div id="gen-actions" class="gen-actions" hidden>
      <button class="btn btn-primary btn-sm" type="button" id="btn-print">Imprimir todas</button>
      <button class="btn btn-sm review-open" type="button" id="btn-list">Copiar URLs</button>
    </div>

    <div id="gen-status" class="setup-status setup-status-loading" role="status" aria-live="polite" hidden></div>
  </section>

  <section id="cards-output" class="gen-grid"></section>
</main>

<template id="card-tpl">
  <article class="gen-card">
    <div class="gen-card-top">
      <div class="gen-card-top-inner">
        <div class="gen-google-g">
          <svg viewBox="0 0 48 48" width="72" height="72">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
        </div>
        <div class="gen-card-text">
          <span class="gen-card-title">Déjanos una reseña<br>en Google</span>
          <div class="gen-stars">★★★★★</div>
        </div>
      </div>
    </div>
    <svg class="gen-wave" viewBox="0 0 360 50" preserveAspectRatio="none">
      <path d="M0 0 C90 50, 270 50, 360 0 L360 50 L0 50 Z" fill="#ffffff"/>
      <path d="M0 8 C90 50, 270 50, 360 8 L360 50 L0 50 Z" fill="#e8f0fe"/>
    </svg>
    <div class="gen-card-bottom">
      <div class="gen-half">
        <span class="gen-label">Acerca tu teléfono</span>
        <svg class="gen-nfc-img" viewBox="0 0 120 100" fill="none">
          <path d="M18 50 C18 30, 30 18, 50 18" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M10 50 C10 25, 25 10, 50 10" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>
          <path d="M2 50 C2 20, 20 2, 50 2" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/>
          <rect x="55" y="28" width="32" height="52" rx="5" stroke="#111" stroke-width="3" fill="#fff"/>
          <rect x="60" y="34" width="22" height="32" rx="2" stroke="#111" stroke-width="2" fill="none"/>
          <line x1="66" y1="72" x2="76" y2="72" stroke="#111" stroke-width="2" stroke-linecap="round"/>
          <text x="61" y="53" font-size="9" font-weight="700" fill="#111" font-family="Inter,sans-serif">NFC</text>
          <circle cx="50" cy="50" r="3" fill="#111"/>
        </svg>
      </div>
      <div class="gen-half">
        <span class="gen-label">Escanear código QR</span>
        <div class="gen-qr-frame">
          <div class="gen-qr-corners">
            <span></span><span></span><span></span><span></span>
          </div>
          <canvas class="gen-qr-canvas"></canvas>
        </div>
      </div>
    </div>
    <div class="gen-card-footer">tarjetasnfc.es</div>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="/generar.js"></script>
</body>
</html>
