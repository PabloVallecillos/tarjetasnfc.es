<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar tarjetas | TarjetasNFC</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="setup-page">
<main class="setup-shell">
  <section class="gen-panel">
    <a class="setup-brand" href="/">Tarjetas<span>NFC</span></a>
    <h1>Generar tarjetas Google Review</h1>
    <p class="setup-copy">Creá hasta 20 tarjetas de una. Cada QR lleva a un ID único. Cuando el cliente lo escanea, configura su URL de destino.</p>

    <form id="gen-form" class="setup-form gen-form">
      <label for="design">Diseño</label>
      <select id="design" class="review-input"></select>

      <label for="count">Cantidad</label>
      <input id="count" class="review-input" type="number" min="1" max="20" value="10">

      <label for="domain">Dominio</label>
      <input id="domain" class="review-input" value="tarjetasnfc.es">

      <button class="btn btn-primary btn-sm" type="submit">Generar tarjetas</button>
    </form>

    <div id="gen-actions" class="gen-actions" hidden>
      <button class="btn btn-primary btn-sm" type="button" id="btn-print">Imprimir todas</button>
      <button class="btn btn-sm review-open" type="button" id="btn-list">Copiar URLs</button>
    </div>

    <div id="gen-status" class="setup-status setup-status-loading" role="status" aria-live="polite" hidden></div>
  </section>

  <!-- Cards rendered as composited images here -->
  <section id="cards-output" class="gen-grid"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="/generar.js"></script>
</body>
</html>
